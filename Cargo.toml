[package]
name = "workstate"
version = "0.1.0"
edition = "2024"
description = "Launch your entire work environment with one command 🚀"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
dialoguer = "0.11"
ratatui = "0.29"
tokio = { version = "1.47", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
serde = { version = "1.0", features = ["derive"] }
toml = "0.9"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde_json = "1.0"
which = "8"
